# 動作モード (SSoT)
#
#   normal : 重要な分岐でユーザーに確認を取りながら進める (既定)
#   loop   : 確認を求めず実装を継続する。停止は 3 つ —
#            ユーザーの停止指示 / タスク完了 / 致命的エラー。
#            ただし「設計の新規追加」「仕様変更」「不可逆操作」は
#            loop でも常にユーザー承認を取る。
#
# 一時切替: 環境変数 HC_MODE=loop (この YAML より優先)
# 参照元  : .claude/hooks/session-start.sh

mode: normal
