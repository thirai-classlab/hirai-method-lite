# 進め方の設定 (ここが正) — 値は normal か loop の 2 つだけ
#
#   normal : 確認あり。重要な分かれ道でひとこと聞いてから進む (最初はこちら)
#   loop   : 自動。確認を求めず最後まで進む。止めたいときは「stop」と伝える。
#            止まるのは 3 つだけ — 「stop」と言われた / やることが終わった /
#            続けられないエラーが出た。
#            ただし「新しい設計を足す」「決めた内容を変える」「元に戻せない操作」は
#            自動のときでも必ず確認する。
#
# 切り替え : /mode normal または /mode loop (このファイルを書き換える)
# 一時的に : 環境変数 HC_MODE=loop (このファイルより優先される)
# 置き場所 : 導入先リポジトリの .claude/mode.yml (/init が置く)
# 読む人   : プラグインの hooks/session-start.sh と scripts/statusline.sh

mode: normal
